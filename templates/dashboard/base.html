<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Doctor Booking Admin{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f6f9; }
        .sidebar {
            width: 220px; background: #2c3e50; color: white;
            height: 100vh; position: fixed; padding: 20px 0;
        }
        .sidebar h2 { text-align: center; padding: 10px 20px 20px; font-size: 16px; border-bottom: 1px solid #3d5166; }
        .sidebar a {
            display: block; padding: 12px 20px; color: #bdc3c7;
            text-decoration: none; font-size: 14px;
        }
        .sidebar a:hover { background: #3d5166; color: white; }
        .main { margin-left: 220px; padding: 30px; }
        .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #2980b9; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f8f9fa; font-weight: 600; }
        .messages { margin-bottom: 16px; }
        .messages li { list-style: none; padding: 10px 14px; border-radius: 4px; margin-bottom: 6px; font-size: 14px; }
        .messages .error { background: #fdecea; color: #c0392b; }
        .messages .success { background: #eafaf1; color: #1e8449; }
        input, select, textarea {
            width: 100%; padding: 8px 10px; margin-top: 4px;
            border: 1px solid #ddd; border-radius: 4px; font-size: 14px;
        }
        .form-group { margin-bottom: 16px; }
        label { font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
{% block full_page %}
<div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="{% url 'dashboard_home' %}">Home</a>
    <a href="{% url 'dashboard_doctors' %}">Doctors</a>
    <a href="{% url 'dashboard_leaves' %}">Leave Requests</a>
    <a href="{% url 'dashboard_slots' %}">View Slots</a>
    <a href="{% url 'dashboard_logout' %}">Logout</a>
</div>
<div class="main">
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</div>
{% endblock %}
</body>
</html>
